<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif">
  <defs>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D97757"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4c9a5f"/></marker>
    <style>.t{fill:#1f2328} .s{fill:#57606a} .b{font-weight:700} .m{font-family:'SF Mono',Consolas,'DejaVu Sans Mono',monospace}</style>
  </defs>
  <rect x="1" y="1" width="998" height="478" rx="16" fill="#ffffff" stroke="#d0d7de"/>
  <text x="32" y="44" font-size="20" class="t b">rc-hub 플러그인 구성</text>
  <text x="32" y="68" font-size="13" class="s">스킬 2개와 동봉 스크립트, 설치 후 파일 위치</text>

  <!-- 플러그인 -->
  <rect x="32" y="90" width="400" height="300" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="48" y="116" font-size="14" class="t b">플러그인 <tspan class="m">rc-hub</tspan></text>
  <text x="416" y="116" font-size="11" text-anchor="end" class="s">레포 루트가 플러그인</text>

  <rect x="48" y="130" width="368" height="78" rx="10" fill="#FBEEE8" stroke="#D97757"/>
  <text x="64" y="158" font-size="14" class="t b m">new-project</text>
  <rect x="326" y="142" width="76" height="22" rx="11" fill="#D97757"/><text x="364" y="157" font-size="11" text-anchor="middle" fill="#fff" class="b">자동 호출</text>
  <text x="64" y="182" font-size="12" class="s">프로젝트 생성, 클론, 이름 변경, 제거 요청 시</text>
  <text x="64" y="198" font-size="11" class="s">예: "foo 프로젝트 만들어줘"</text>

  <rect x="48" y="218" width="368" height="78" rx="10" fill="#EAF5EC" stroke="#4c9a5f"/>
  <text x="64" y="246" font-size="14" class="t b m">setup</text>
  <rect x="326" y="230" width="76" height="22" rx="11" fill="#4c9a5f"/><text x="364" y="245" font-size="11" text-anchor="middle" fill="#fff" class="b">수동 실행</text>
  <text x="64" y="270" font-size="12" class="s">새 머신에서 한 번, 업데이트 후 설치본 갱신</text>
  <text x="64" y="286" font-size="11" class="s m">/rc-hub:setup</text>

  <rect x="48" y="306" width="368" height="72" rx="10" fill="#fff" stroke="#d0d7de"/>
  <text x="64" y="328" font-size="12" class="t b">동봉 파일</text>
  <text x="64" y="348" font-size="11.5" class="t m">hub/install.sh    hub/restore.sh</text>
  <text x="64" y="366" font-size="11.5" class="t m">systemd/claude-rc-restore.service</text>

  <!-- 화살표 -->
  <text x="516" y="150" font-size="11" text-anchor="middle" fill="#D97757" class="b">목록 추가, 실행</text>
  <line x1="418" y1="160" x2="596" y2="160" stroke="#D97757" stroke-width="2" marker-end="url(#arrO)"/>
  <text x="470" y="247" font-size="11" text-anchor="middle" fill="#4c9a5f" class="b">설치</text>
  <path d="M418,257 L520,257 M520,200 L520,320" fill="none" stroke="#4c9a5f" stroke-width="2"/>
  <line x1="520" y1="200" x2="596" y2="200" stroke="#4c9a5f" stroke-width="2" marker-end="url(#arrG)"/>
  <line x1="520" y1="320" x2="596" y2="320" stroke="#4c9a5f" stroke-width="2" marker-end="url(#arrG)"/>

  <!-- 설치 위치 -->
  <rect x="600" y="90" width="368" height="140" rx="12" fill="#fff" stroke="#8c959f"/>
  <text x="616" y="116" font-size="14" class="t b m">~/dev/.hub</text>
  <text x="952" y="116" font-size="11" text-anchor="end" class="s">설치본과 상태 파일</text>
  <text x="616" y="146" font-size="12" class="t m">restore.sh</text><text x="740" y="146" font-size="12" class="s">복구 스크립트 설치본</text>
  <text x="616" y="174" font-size="12" class="t m">windows.tsv</text><text x="740" y="174" font-size="12" class="s">윈도우 목록</text>
  <text x="616" y="202" font-size="12" class="t m">logs/</text><text x="740" y="202" font-size="12" class="s">실행 로그</text>

  <text x="800" y="246" font-size="11" class="s">부팅 시 실행</text>
  <line x1="784" y1="258" x2="784" y2="234" stroke="#4c9a5f" stroke-width="2" marker-end="url(#arrG)"/>
  <rect x="600" y="260" width="368" height="130" rx="12" fill="#EAF5EC" stroke="#4c9a5f"/>
  <text x="616" y="286" font-size="14" class="t b">systemd 사용자 서비스</text>
  <text x="616" y="314" font-size="12" class="t m">~/.config/systemd/user/</text>
  <text x="616" y="334" font-size="12" class="t m">claude-rc-restore.service</text>
  <text x="616" y="364" font-size="12" class="s">로그인 없이 부팅 직후 실행 (linger)</text>

  <rect x="32" y="408" width="936" height="52" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="48" y="430" font-size="12.5" class="t">플러그인은 Claude Code 세션 안에서만 동작. 부팅 시 실행은 systemd 담당.</text>
  <text x="48" y="449" font-size="12.5" class="t">플러그인 설치 경로는 업데이트 때마다 바뀌므로 서비스는 <tspan class="m">~/dev/.hub</tspan> 설치본을 실행.</text>
</svg>
